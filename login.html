<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinSight Intelligence</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-main);
            margin: 0;
            overflow: hidden;
        }

        /* Abstract Background Elements */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
        }
        .blob-1 {
            width: 500px;
            height: 500px;
            background: #2563EB; /* Deep Blue instead of Emerald */
            top: -100px;
            right: -100px;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: #4F46E5; /* Indigo */
            bottom: -50px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 48px;
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            /* Optional Glassmorphism */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .login-logo i {
            color: var(--text-primary); /* Slate instead of Emerald */
            font-size: 2.2rem;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-inverse-muted);
            font-size: 1.25rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            background: var(--bg-main);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--text-primary); /* Slate */
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--bg-sidebar); /* Dark Slate / Navy */
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 32px;
        }

        .login-btn:hover {
            background: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(15, 23, 42, 0.5);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }

        .toggle-mode {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .toggle-mode a {
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        
        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--status-negative);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="ph ph-sparkle"></i>
                FinSight
            </div>
            <p id="header-desc">Create an account to start your journey</p>
        </div>

        <div id="error-msg" class="error-message">
            <i class="ph ph-warning-circle"></i>
            <span id="error-text">Invalid credentials</span>
        </div>

        <form id="auth-form">
            <!-- Name field is only visible for registration -->
            <div class="form-group" id="name-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <i class="ph ph-user"></i>
                    <input type="text" id="name" placeholder="Sarah Connor">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope-simple"></i>
                    <input type="email" id="email" placeholder="admin@finsight.io" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">
                <span id="submit-text">Create Account</span>
                <i class="ph ph-arrow-right"></i>
            </button>

            <div class="toggle-mode">
                <span id="toggle-prompt">Already have an account?</span> 
                <a id="toggle-link">Sign In</a>
            </div>
        </form>
    </div>

    <script>
        let isLoginMode = false; // Default to Create Account

        const form = document.getElementById('auth-form');
        const nameGroup = document.getElementById('name-group');
        const nameInput = document.getElementById('name');
        const headerDesc = document.getElementById('header-desc');
        const submitText = document.getElementById('submit-text');
        const togglePrompt = document.getElementById('toggle-prompt');
        const toggleLink = document.getElementById('toggle-link');
        const errorDiv = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');
        const btn = document.getElementById('submit-btn');

        // Toggle between Login and Register
        toggleLink.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            errorDiv.style.display = 'none';

            if (isLoginMode) {
                // Switch to Login
                nameGroup.style.display = 'none';
                nameInput.removeAttribute('required');
                headerDesc.textContent = 'Sign in to access secure financial intelligence';
                submitText.textContent = 'Sign In';
                togglePrompt.textContent = 'New to FinSight?';
                toggleLink.textContent = 'Create an Account';
            } else {
                // Switch to Register
                nameGroup.style.display = 'block';
                nameInput.setAttribute('required', 'true');
                headerDesc.textContent = 'Create an account to start your journey';
                submitText.textContent = 'Create Account';
                togglePrompt.textContent = 'Already have an account?';
                toggleLink.textContent = 'Sign In';
            }
        });

        // Handle Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            // Reset UI
            errorDiv.style.display = 'none';
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Processing...';
            btn.style.opacity = '0.7';

            try {
                if (isLoginMode) {
                    // --- LOGIN ---
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();


                    if (res.ok) {
                        localStorage.setItem('finsight_token', data.token);
                        localStorage.setItem('finsight_user', JSON.stringify(data.user));
                        
                        btn.innerHTML = '<i class="ph ph-check-circle"></i> Success';
                        btn.style.background = 'var(--status-positive)';
                        
                        setTimeout(() => window.location.href = 'index.html#/dashboard', 500);
                    } else {
                        throw new Error(data.error || 'Authentication failed');
                    }
                } else {
                    // --- REGISTER ---
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        // Registration success! Now automatically log them in
                        const loginRes = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });
                        const loginData = await loginRes.json();

                        
                        localStorage.setItem('finsight_token', loginData.token);
                        localStorage.setItem('finsight_user', JSON.stringify(loginData.user));
                        
                        btn.innerHTML = '<i class="ph ph-check-circle"></i> Account Created';
                        btn.style.background = 'var(--status-positive)';
                        
                        setTimeout(() => window.location.href = 'index.html#/dashboard', 500);
                        
                    } else {
                        throw new Error(data.error || 'Registration failed');
                    }
                }
            } catch (err) {
                console.error(err);
                errorText.textContent = err.message;
                errorDiv.style.display = 'flex';
                
                // Revert button based on mode
                btn.innerHTML = `<span id="submit-text">${isLoginMode ? 'Sign In' : 'Create Account'}</span><i class="ph ph-arrow-right"></i>`;
                btn.style.opacity = '1';
                
                // Shake animation
                const container = document.querySelector('.login-container');
                container.style.animation = 'shake 0.4s ease-in-out';
                setTimeout(() => container.style.animation = '', 400);
            }
        });
        
        // Dynamic keyframes for shake
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
